# Render Blueprint — one-click deploy of the ReachInbox stack.
# Push this repo to GitHub, then on Render: "New → Blueprint" and pick the repo.
# It will create all four resources below and wire the env vars together.
#
# You still need to add your OAuth + Slack + SMTP secrets in the Render dashboard
# (Environment variables per service), which are marked <FILL> below.

services:
  # --- Postgres (relational DB) ---
  - type: psql
    name: reachinbox-db
    plan: free
    databaseName: reachinbox
    user: reachinbox

  # --- Redis (BullMQ queue + rate-limit counters) ---
  - type: keyValue
    name: reachinbox-redis
    plan: free

  # --- API (Express) — also serves the built frontend in production ---
  - type: web
    name: reachinbox-api
    plan: free
    rootDir: backend
    buildCommand: >
      npm ci &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: FRONTEND_URL        # <FILL> set to your API's public URL (served app)
        value: https://reachinbox-api.onrender.com
      - key: GOOGLE_CALLBACK_URL # <FILL> https://<api-host>/api/auth/google/callback
        value: https://reachinbox-api.onrender.com/api/auth/google/callback
      - key: SLACK_REDIRECT_URI  # <FILL> https://<api-host>/api/auth/slack/callback
        value: https://reachinbox-api.onrender.com/api/auth/slack/callback
      - key: JWT_SECRET          # <FILL> a long random string
        value: dev-only-secret-change-me
      - key: DEV_LOGIN_ENABLED
        value: "false"
      - key: ELASTICSEARCH_ENABLED
        value: "false"
      # Add these in the dashboard with your real values:
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SLACK_CLIENT_ID, SLACK_CLIENT_SECRET,
      # SLACK_BOT_TOKEN, SMTP_USER, SMTP_PASS

  # --- BullMQ worker (background; persistent job processing + rate-limit alerts) ---
  - type: worker
    name: reachinbox-worker
    plan: free
    rootDir: backend
    buildCommand: >
      npm ci &&
      npx prisma generate &&
      npm run build
    startCommand: node dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: JWT_SECRET
        value: dev-only-secret-change-me
      # SLACK_* / SMTP_* as on the API service
    autoDeploy: true
