# Render Blueprint — deploys the ReachInbox API + background worker.
#
# USAGE (simplest, most reliable):
#   1. Render -> New -> PostgreSQL   -> create `reachinbox-db`, note its Connection String (psql://...)
#   2. Render -> New -> Key Value    -> create `reachinbox-redis`, note its redis:// connection URL
#   3. Render -> New -> Blueprint     -> pick this repo -> it creates the API + worker below
#   4. In the deploy screen, paste the two connection strings into DATABASE_URL / REDIS_URL
#
# This file intentionally avoids cross-resource references (which Render can't
# validate at import time) so the Blueprint imports cleanly every time.

services:
  # --- API (Express) — also serves the built frontend in production ---
  - type: web
    name: reachinbox-api
    plan: free
    rootDir: backend
    buildCommand: >
      npm ci &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run build
    startCommand: node dist/server.js
    autoDeploy: true
    envVars:
      # <FILL> paste your Render PostgreSQL connection string
      - key: DATABASE_URL
        sync: true
      # <FILL> paste your Render Key Value (Redis) connection URL
      - key: REDIS_URL
        sync: true
      - key: NODE_ENV
        value: production
      # <FILL> set to this API service's public URL once deployed
      - key: FRONTEND_URL
        value: https://reachinbox-api.onrender.com
      - key: GOOGLE_CALLBACK_URL
        value: https://reachinbox-api.onrender.com/api/auth/google/callback
      - key: SLACK_REDIRECT_URI
        value: https://reachinbox-api.onrender.com/api/auth/slack/callback
      - key: JWT_SECRET
        value: dev-only-secret-change-me
      - key: DEV_LOGIN_ENABLED
        value: "true"
      - key: ELASTICSEARCH_ENABLED
        value: "false"

  # --- BullMQ worker (background; persistent jobs + rate-limit alerts) ---
  - type: worker
    name: reachinbox-worker
    plan: free
    rootDir: backend
    buildCommand: >
      npm ci &&
      npx prisma generate &&
      npm run build
    startCommand: node dist/worker.js
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: true
      - key: REDIS_URL
        sync: true
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: dev-only-secret-change-me
