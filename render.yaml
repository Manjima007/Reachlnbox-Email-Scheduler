# Render Blueprint — deploys the ReachInbox API (which also runs the BullMQ
# worker in-process, since free Render has no background-worker service type).
#
# USAGE:
#   1. Render -> New -> PostgreSQL  -> create a db, copy its psql:// connection string
#   2. Render -> New -> Key Value   -> create a Redis, copy its redis:// connection URL
#   3. Render -> New -> Blueprint   -> pick this repo -> it creates the API service
#   4. Paste the two connection strings into DATABASE_URL / REDIS_URL, then Deploy
#
# The API process starts the BullMQ worker in-process (RUN_WORKER=true), so a
# single web service is enough for the whole app on a free account.

services:
  - type: web
    name: reachinbox-api
    runtime: node
    plan: free
    buildCommand: >
      npm ci &&
      npm run build --workspace frontend &&
      cd backend && npx prisma generate && npx prisma migrate deploy &&
      npx tsc -p tsconfig.json &&
      cd ../frontend && rm -rf dist && npx vite build
    startCommand: node backend/dist/server.js
    autoDeploy: true
    envVars:
      # <FILL> paste your Render PostgreSQL connection string
      - key: DATABASE_URL
        sync: false
      # <FILL> paste your Render Key Value (Redis) connection URL
      - key: REDIS_URL
        sync: false
      - key: NODE_ENV
        value: production
      # <FILL> set to this API service's public URL once deployed
      - key: FRONTEND_URL
        value: https://reachinbox-api.onrender.com
      - key: GOOGLE_CALLBACK_URL
        value: https://reachinbox-api.onrender.com/api/auth/google/callback
      - key: SLACK_REDIRECT_URI
        value: https://reachinbox-api.onrender.com/api/auth/slack/callback
      - key: JWT_SECRET
        value: dev-only-secret-change-me
      - key: DEV_LOGIN_ENABLED
        value: "true"
      - key: ELASTICSEARCH_ENABLED
        value: "false"
      # Run the BullMQ worker inside the API process (single-service deploy).
      - key: RUN_WORKER
        value: "true"
