# Render Blueprint — deploys the ReachInbox API + background worker.
#
# USAGE:
#   1. Render -> New -> PostgreSQL  -> create `reachinbox-db`, copy its psql:// connection string
#   2. Render -> New -> Key Value   -> create `reachinbox-redis`, copy its redis:// connection URL
#   3. Render -> New -> Blueprint   -> pick this repo -> creates the API + worker
#   4. When prompted, paste DATABASE_URL + REDIS_URL (+ your OAuth/Slack/SMTP secrets)
#
# NOTE: DATABASE_URL / REDIS_URL are marked sync:false so Render prompts for them
# at deploy time (cross-resource auto-wiring can't be validated at import time).

services:
  # --- API (Express) — also serves the built frontend in production ---
  - type: web
    name: reachinbox-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: >
      npm ci &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run build
    startCommand: node dist/server.js
    autoDeploy: true
    envVars:
      # <FILL> paste your Render PostgreSQL connection string
      - key: DATABASE_URL
        sync: false
      # <FILL> paste your Render Key Value (Redis) connection URL
      - key: REDIS_URL
        sync: false
      - key: NODE_ENV
        value: production
      # <FILL> set to this API service's public URL once deployed
      - key: FRONTEND_URL
        value: https://reachinbox-api.onrender.com
      - key: GOOGLE_CALLBACK_URL
        value: https://reachinbox-api.onrender.com/api/auth/google/callback
      - key: SLACK_REDIRECT_URI
        value: https://reachinbox-api.onrender.com/api/auth/slack/callback
      - key: JWT_SECRET
        value: dev-only-secret-change-me
      - key: DEV_LOGIN_ENABLED
        value: "true"
      - key: ELASTICSEARCH_ENABLED
        value: "false"

  # --- BullMQ worker (background; persistent jobs + rate-limit alerts) ---
  - type: worker
    name: reachinbox-worker
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: >
      npm ci &&
      npx prisma generate &&
      npm run build
    startCommand: node dist/worker.js
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: dev-only-secret-change-me
